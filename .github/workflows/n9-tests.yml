name: N9 branding and media tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release
      - run: python3 -m unittest discover -s pi-network/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/n9-ui playwright@1.58.2
      - run: /tmp/n9-ui/node_modules/.bin/playwright install --with-deps chromium
      - run: node --test scripts/tests/*.test.cjs
        env:
          NODE_PATH: /tmp/n9-ui/node_modules
      - name: Build and validate self-contained ARM64 release
        shell: pwsh
        run: |
          ./scripts/Build-InitiativeTrackerRelease.ps1 -OutputRoot /tmp/n9-release
          $manifest = Get-ChildItem /tmp/n9-release -Recurse -Filter '*.manifest.json' | Select-Object -First 1
          if (!$manifest) { throw 'No release manifest produced' }
          ./scripts/Test-InitiativeTrackerRelease.ps1 -ManifestPath $manifest.FullName
